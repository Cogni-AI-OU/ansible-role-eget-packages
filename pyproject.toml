# Project metadata for the ansible-role-eget-packages role.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-role-eget-packages"
version = "0.1.0"
description = "Ansible role that installs binaries from a configurable list of package names using predefined eget commands."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "tabulate>=0.9.0",
  "PyYAML>=6.0.1",
]

authors = [
  { name = "Cogni AI" },
]

[project.urls]
Homepage = "https://github.com/Cogni-AI-OU/ansible-role-eget-packages"
Repository = "https://github.com/Cogni-AI-OU/ansible-role-eget-packages"
